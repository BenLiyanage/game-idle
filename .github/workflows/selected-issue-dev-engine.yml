name: Selected Issue Dev Engine

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dev-engine-issue-wip
  cancel-in-progress: false

jobs:
  claim:
    name: claim selected issue
    if: github.event.label.name == 'selected-for-development'
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.claim.outputs.issue_number }}
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - name: Claim single WIP issue
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json number,state,labels)"
          state="$(jq -r '.state' <<<"$issue_json")"
          has_selected="$(jq -r '[.labels[].name] | index("selected-for-development") != null' <<<"$issue_json")"
          if [[ "$state" != "OPEN" || "$has_selected" != "true" ]]; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          other_wip="$(
            gh issue list --repo "$REPO" --state open --label in-progress --json number --jq '.[].number' |
              awk -v selected="$ISSUE_NUMBER" '$1 != selected { count += 1 } END { print count + 0 }'
          )"
          if [[ "$other_wip" != "0" ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Dev Engine did not claim this issue because another issue is already labeled in-progress."
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "<!-- dev-engine-claim:v1 -->Dev Engine claimed this issue for the supervised host-native runner."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label selected-for-development --add-label in-progress
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "claimed=true" >> "$GITHUB_OUTPUT"

  implement:
    name: host-native issue worker
    needs: claim
    if: needs.claim.outputs.claimed == 'true'
    runs-on: [self-hosted, dev-engine]
    timeout-minutes: 120
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Run host-native Codex issue worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CODEX_AGENT_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tools/agent/run_issue.sh "${{ needs.claim.outputs.issue-number }}"

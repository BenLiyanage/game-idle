name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Godot
        shell: bash
        run: |
          set -euo pipefail

          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${zip}"

          echo "Downloading ${url}"
          curl -fsSL "$url" -o godot.zip
          unzip -q godot.zip -d godot-bin

          godot_path="$(find godot-bin -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          if [[ -z "$godot_path" ]]; then
            echo "Godot binary was not found after extraction" >&2
            exit 1
          fi

          chmod +x "$godot_path"
          echo "GODOT_BIN=$PWD/$godot_path" >> "$GITHUB_ENV"

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/verify.sh

      - name: Upload diagnostics
        if: failure()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-diagnostics
          if-no-files-found: ignore
          path: |
            godot.zip
            godot-bin/
            ~/.local/share/godot/app_userdata/game-idle/logs/

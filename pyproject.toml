[tool.ruff]
required-version = "==0.16.6"
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "SIM",
    "UP",
    "RUF",
]

# Suppressions must be narrow: prefer per-line `noqa` with the rule code and a
# short reason, or per-file ignores here when generated/test code genuinely needs
# a different shape. Do not globally disable useful rules to avoid small fixes.
